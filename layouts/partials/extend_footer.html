<script>
  (function () {
    const original = document.getElementById("theme-toggle");
    if (!original) return;

    const options = [
      {
        value: "system",
        label: "Match system",
        icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.8" y="2.6" width="12.4" height="8.6" rx="1.4"></rect><path d="M6 14h4"></path></svg>'
      },
      {
        value: "light",
        label: "Light",
        icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1"></circle><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.95 3.05l-1.13 1.13M4.18 11.82l-1.13 1.13M12.95 12.95l-1.13-1.13M4.18 4.18L3.05 3.05"></path></svg>'
      },
      {
        value: "dark",
        label: "Dark",
        icon: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"></path></svg>'
      }
    ];

    const control = document.createElement("fieldset");
    control.className = "theme-picker";
    control.innerHTML = '<legend class="visually-hidden">Color theme</legend>' + options.map(function (option) {
      return '<label class="theme-picker-option" title="' + option.label + '">' +
        '<input type="radio" name="site-theme" value="' + option.value + '">' +
        option.icon + '<span class="visually-hidden">' + option.label + '</span></label>';
    }).join("");
    original.insertAdjacentElement("afterend", control);

    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const inputs = Array.from(control.querySelectorAll("input"));

    function preference() {
      const stored = localStorage.getItem("pref-theme");
      return stored === "light" || stored === "dark" ? stored : "system";
    }

    function apply(value) {
      if (value === "system") {
        localStorage.removeItem("pref-theme");
        document.documentElement.dataset.theme = media.matches ? "dark" : "light";
      } else {
        localStorage.setItem("pref-theme", value);
        document.documentElement.dataset.theme = value;
      }
      inputs.forEach(function (input) {
        input.checked = input.value === value;
        input.parentElement.dataset.checked = String(input.checked);
      });
    }

    inputs.forEach(function (input) {
      input.addEventListener("change", function () { apply(input.value); });
    });
    media.addEventListener("change", function () {
      if (preference() === "system") apply("system");
    });
    apply(preference());
  })();
</script>
<script>
  (function () {
    const reel = document.querySelector("[data-project-reel]");
    if (reel) {
      const panels = Array.from(reel.querySelectorAll(".project-panel"));
      const move = function (direction) {
        const current = panels.reduce(function (closest, panel) {
          return Math.abs(panel.offsetLeft - reel.scrollLeft) < Math.abs(closest.offsetLeft - reel.scrollLeft) ? panel : closest;
        }, panels[0]);
        const index = panels.indexOf(current);
        const target = panels[Math.max(0, Math.min(panels.length - 1, index + direction))];
        if (target) target.scrollIntoView({
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "nearest",
          inline: "start"
        });
      };

      document.querySelector("[data-corridor-prev]")?.addEventListener("click", function () { move(-1); });
      document.querySelector("[data-corridor-next]")?.addEventListener("click", function () { move(1); });
      reel.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          move(event.key === "ArrowLeft" ? -1 : 1);
        }
      });
    }

    const filters = Array.from(document.querySelectorAll("[data-project-filter]"));
    const items = Array.from(document.querySelectorAll("[data-project-kind]"));
    const empty = document.querySelector("[data-project-empty]");
    filters.forEach(function (button) {
      button.addEventListener("click", function () {
        const selected = button.dataset.projectFilter;
        let visible = 0;
        filters.forEach(function (filter) {
          const active = filter === button;
          filter.classList.toggle("is-active", active);
          filter.setAttribute("aria-pressed", String(active));
        });
        items.forEach(function (item) {
          const show = selected === "all" || item.dataset.projectKind === selected;
          item.hidden = !show;
          if (show) visible += 1;
        });
        if (empty) empty.hidden = visible !== 0;
      });
    });
  })();
</script>
